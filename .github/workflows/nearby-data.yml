# Rebuilds nearby/nearby.json (Melbourne's Coles, Woolworths, Aldi, Chemist Warehouse
# and parks, from OpenStreetMap) on the 1st of each month and commits it. The
# travel-times Edge Function reads the file from GitHub and recomputes each listing's
# Nearby when the file's date changes, so none of this is stored in Supabase.
# Run it by hand from the Actions tab too.
name: Refresh nearby data

on:
  schedule:
    - cron: "0 15 1 * *" # 1st of the month, 2am Melbourne in summer
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exits with an error (and leaves the file alone) if Overpass is down or the
      # results look too thin.
      - run: python3 nearby/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nearby/nearby.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh nearby stores and parks"
          git push
